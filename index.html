<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客服排班调整工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">排</div>
          <div>
            <h1>客服排班调整工作台</h1>
            <p>先生成，再微调，最后确认导出</p>
          </div>
        </div>
        <div class="toolbar">
          <label class="select-field">
            <span>月份</span>
            <select id="monthSelect">
              <option value="2026-07">2026 年 7 月</option>
              <option value="2026-08">2026 年 8 月</option>
            </select>
          </label>
          <button class="secondary-btn" id="undoBtn" title="撤销上一步调整">撤销</button>
          <button class="secondary-btn" id="redoBtn" title="恢复刚撤销的调整">重做</button>
          <button class="primary-btn" id="generateBtn">重新生成</button>
          <button class="secondary-btn" id="exportBtn">导出 Excel</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="left-panel panel">
          <button class="panel-collapse left-collapse" id="leftCollapseBtn" title="折叠左侧">‹</button>
          <section>
            <h2>班次时间</h2>
            <div class="shift-notes">
              <div><strong>在线护士 / 盯群早班</strong><span>09:00 - 18:30</span></div>
              <div><strong>在线护士 / 盯群中班</strong><span>10:00 - 20:00</span></div>
              <div><strong>在线护士 / 盯群夜班</strong><span>20:00 - 次日 09:00，按 1.5 天计</span></div>
              <div><strong>转潜中班</strong><span>10:00 - 20:30</span></div>
              <div><strong>休息</strong><span>每月 6 天</span></div>
            </div>
          </section>

          <section>
            <h2>排班规则</h2>
            <div id="ruleCards" class="rule-cards"></div>
          </section>

          <section>
            <div class="panel-heading">
              <h2>人员配置</h2>
              <button class="mini-btn" id="addEmployeeBtn">添加</button>
            </div>
            <div id="employeeList" class="employee-list"></div>
          </section>
        </aside>

        <section class="schedule-panel">
          <div class="schedule-tools">
            <div>
              <h2>7 月排班表</h2>
              <p id="selectionHint">点击单元格修改；开启刷子后可拖动批量填充。</p>
            </div>
            <div class="filter-bar" id="roleFilter">
              <button data-role-filter="all" class="filter active">全部</button>
              <button data-role-filter="盯群" class="filter">盯群</button>
              <button data-role-filter="转潜" class="filter">转潜</button>
              <button data-role-filter="在线护士" class="filter">护士</button>
              <button id="summaryToggleBtn" class="filter" type="button">隐藏统计</button>
            </div>
            <div class="brush-bar" id="brushBar">
              <span>单日修改</span>
              <span class="bar-divider"></span>
              <span>设为：</span>
              <button data-brush="none" class="brush active">选择</button>
              <button data-brush="early" class="brush shift-early">早班</button>
              <button data-brush="middle" class="brush shift-middle">中班</button>
              <button data-brush="night" class="brush shift-night">夜班</button>
              <span class="bar-divider"></span>
              <button data-brush="swap" class="brush">调班</button>
              <button id="clearVisibleBtn" class="brush danger-action" type="button">清空</button>
              <button class="help-dot" type="button" title="选择：点击单元格打开单日编辑。设为：点选早/中/夜后，按住鼠标拖过表格可批量改班。调班：先点第一个格子，再点第二个格子交换。">?</button>
            </div>
          </div>

          <div class="grid-wrap">
            <table id="scheduleTable" class="schedule-table"></table>
          </div>
        </section>

        <aside class="right-panel panel">
          <button class="panel-collapse right-collapse" id="rightCollapseBtn" title="折叠右侧">›</button>
          <section>
            <div class="panel-heading">
              <h2>操作检查</h2>
              <label class="toggle">
                <input id="conflictOnly" type="checkbox" />
                <span>只看冲突</span>
              </label>
            </div>
            <div id="conflictList" class="conflict-list"></div>
          </section>

          <section>
            <h2>快速调整</h2>
            <div class="quick-actions">
              <button id="balanceBtn" title="按人员错开休息日，并尽量补足每日覆盖。">均衡休息</button>
              <button id="fillCoverageBtn" title="检查每天转潜、盯群和护士覆盖，不足时自动补人。">补足盯群/护士</button>
              <button id="rotateBtn" title="按周调整早中班：同一员工一周内尽量连续早班或连续中班。">早中班轮换</button>
              <button id="clearUnlockedBtn" title="把未确认锁定人员全部改为休息，已确认人员不变。">清空未锁定</button>
            </div>
          </section>

          <section>
            <h2>员工确认</h2>
            <div id="confirmList" class="confirm-list"></div>
          </section>
        </aside>
      </main>

      <div id="quickEditor" class="quick-editor" hidden></div>
      <div id="toast" class="toast" hidden></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
